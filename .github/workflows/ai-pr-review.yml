name: AI PR Review & Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    name: AI Code Review (GPT-4o)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install openai SDK
        run: pip install openai --quiet

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff
          echo "Diff size: $(wc -c < pr.diff) bytes"

      - name: Run AI Review
        id: review
        env:
          GPT_TOKEN: ${{ secrets.GPT_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python .github/scripts/ai_review.py < pr.diff > review.json
          echo "=== Review Result ==="
          cat review.json

          # Export approved status for next steps
          APPROVED=$(python -c "import json; r=json.load(open('review.json')); print('true' if r['approved'] else 'false')")
          echo "approved=$APPROVED" >> $GITHUB_OUTPUT

      - name: Post Review Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT=$(python3 - <<'EOF'
          import json, sys

          with open("review.json") as f:
              r = json.load(f)

          approved = r.get("approved", False)
          summary = r.get("summary", "")
          issues = r.get("issues", [])

          icon = "✅" if approved else "❌"
          decision = "批准合併" if approved else "需要修改"

          lines = [
              "## 🤖 AI 程式碼審查結果",
              "",
              f"**決定：** {icon} {decision}",
              "",
              f"**摘要：** {summary}",
          ]

          if issues:
              lines += ["", "**需修正的問題：**"]
              for issue in issues:
                  lines.append(f"- {issue}")

          lines += [
              "",
              "---",
              "_由 [GitHub Models](https://github.com/marketplace/models) GPT-4o 自動審查_"
          ]

          print("\n".join(lines))
          EOF
          )
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"

      - name: Auto Merge if Approved
        if: steps.review.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "AI 審查通過，執行自動 merge..."
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --subject "${{ github.event.pull_request.title }}" \
            --body "Auto-merged after AI review approval." \
            --delete-branch

      - name: Skip Merge (Not Approved)
        if: steps.review.outputs.approved == 'false'
        run: echo "AI 審查未通過，請依照審查意見修正後重新提交。"
